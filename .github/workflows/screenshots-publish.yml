name: Publish screenshots

# Trusted half of the screenshot flow. workflow_run always runs this file and the scripts it
# checks out from the default branch, never the pull request's code. The artifact is untrusted
# input: the PR comes from run metadata, and only validated PNGs and escaped text are published.
on:
  workflow_run:
    workflows: [Screenshots]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

# One publish per branch at a time. Each run also checks the PR's current head, so an older run
# that finishes late publishes nothing instead of replacing newer screenshots.
concurrency:
  group: screenshots-publish-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the pull request from run metadata
        id: pr
        env:
          PULLS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(jq -r --arg sha "$SHA" '[.[] | select(.head.sha == $sha) | .number][0] // empty' <<< "$PULLS")
          [[ "$number" =~ ^[0-9]+$ && "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "No same-repository pull request for this run; nothing to publish."; exit 0; }
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.head.sha')
          [[ "$head" == "$SHA" ]] || { echo "#$number has moved on to $head; skipping screenshots for $SHA."; exit 0; }
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.number
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.pr.outputs.number
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: incoming
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate the images
        if: steps.pr.outputs.number
        run: |
          mkdir -p verified
          for file in incoming/*; do
            name=$(basename "$file")
            if [[ "$name" == manifest.json ]]; then cp "$file" verified/; continue; fi
            [[ "$name" =~ ^[a-z0-9-]{1,100}\.png$ && -f "$file" && ! -L "$file" ]] || { echo "Skipping unexpected file $name"; continue; }
            [[ $(stat -c %s "$file") -le 15000000 ]] || { echo "Skipping oversized $name"; continue; }
            problem=$(node scripts/screenshots/verify-png.mjs "$file" 2>&1) || { echo "Skipping $name: $problem"; continue; }
            cp "$file" verified/
          done
          [[ -f verified/manifest.json ]] || { echo "Missing manifest"; exit 1; }
      - name: Publish images to the screenshots branch
        if: steps.pr.outputs.number
        id: publish
        env:
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        # The branch holds every run's images, gigabytes in all. Fetch only its tip's trees, build
        # the commit in a scratch index and push it, so git sends only this run's images. With
        # lazy fetching off, anything that would download an old image fails instead.
        run: |
          dir="pr-${PR}/${SHA::7}"
          export GIT_NO_LAZY_FETCH=1 GIT_INDEX_FILE="$RUNNER_TEMP/screenshots-index"
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          # Each run writes its own folder, so a commit rebuilt on a newer tip never conflicts. A
          # whole stack pushed at once starts many runs together, so retry with a random pause
          # until they spread out.
          for i in $(seq 1 12); do
            rm -f "$GIT_INDEX_FILE"
            if git fetch --depth=1 --filter=blob:none origin screenshots; then
              tip=$(git rev-parse FETCH_HEAD)
              git read-tree "$tip"
              git rm -r -q --cached --ignore-unmatch -- "$dir"
            else
              # ls-remote exits 2 only when the branch doesn't exist yet; anything else is retried.
              found=0; git ls-remote --exit-code --heads origin screenshots > /dev/null || found=$?
              if [ "$found" -ne 2 ]; then sleep $(( (RANDOM % 5) + i )); continue; fi
              tip=""
              git read-tree --empty
            fi
            find verified -maxdepth 1 -name '*.png' -print0 | while IFS= read -r -d '' file; do
              printf '100644 %s\t%s\n' "$(git hash-object -w -- "$file")" "$dir/$(basename "$file")"
            done | git update-index --index-info
            tree=$(git write-tree --missing-ok)
            # A rerun of the same commit can produce identical images; nothing to push is fine.
            if [ -n "$tip" ] && [ "$tree" = "$(git rev-parse "$tip^{tree}")" ]; then pushed=1; break; fi
            commit=$(git commit-tree "$tree" ${tip:+-p "$tip"} -m "chore: screenshots for #${PR} at ${SHA::7}")
            # --no-thin: a thin pack would read the branch's old images as delta bases.
            if git push --no-thin origin "$commit:refs/heads/screenshots"; then pushed=1; break; fi
            sleep $(( (RANDOM % 5) + i ))
          done
          [ -n "${pushed:-}" ] || { echo "Could not push screenshots"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Update the PR description
        if: steps.pr.outputs.number
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          DIR: ${{ steps.publish.outputs.dir }}
          SHA: ${{ steps.pr.outputs.sha }}
          MANIFEST: verified/manifest.json
          IMAGES: verified
        run: node scripts/screenshots/update-pr-body.mjs
