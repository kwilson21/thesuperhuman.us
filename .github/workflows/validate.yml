name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # docs/verification.md: Dafny checks the LemmaScript contracts listed in LemmaScript-files.txt, pinned by version and
      # checksum as in Tally. The unpacked tool is dev-only and never part of the Worker.
      - name: Install Dafny 4.9.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dafny.zip" https://github.com/dafny-lang/dafny/releases/download/v4.9.0/dafny-4.9.0-x64-ubuntu-20.04.zip
          echo "b21575395f2fe3dbcaca09a8219fe29c99d248134e516e95dc3f0c3687d16c27  $RUNNER_TEMP/dafny.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dafny.zip" -d "$RUNNER_TEMP/dafny-install"
          echo "$RUNNER_TEMP/dafny-install/dafny" >> "$GITHUB_PATH"
      - name: LemmaScript contracts (Dafny)
        run: pnpm run verify:dafny
      - name: Quint invoice-events model
        run: pnpm run verify:quint
      - name: Quint mutants must fail
        run: pnpm run verify:quint:mutants
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
        env:
          PUBLICIST_PRIVATE_TOKEN: ${{ secrets.PUBLICIST_PRIVATE_TOKEN }}
      - run: pnpm exec vitest run tests/architecture/client-bundle.test.ts
        env:
          REQUIRE_CLIENT_BUNDLE: "1"
