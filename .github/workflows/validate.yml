name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # docs/verification.md: Dafny checks the LemmaScript contracts listed in LemmaScript-files.txt, pinned by version and
      # checksum as in Tally. The unpacked tool is dev-only and never part of the Worker.
      - name: Install Dafny 4.9.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dafny.zip" https://github.com/dafny-lang/dafny/releases/download/v4.9.0/dafny-4.9.0-x64-ubuntu-20.04.zip
          echo "b21575395f2fe3dbcaca09a8219fe29c99d248134e516e95dc3f0c3687d16c27  $RUNNER_TEMP/dafny.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dafny.zip" -d "$RUNNER_TEMP/dafny-install"
          echo "$RUNNER_TEMP/dafny-install/dafny" >> "$GITHUB_PATH"
      - name: LemmaScript contracts (Dafny)
        run: pnpm run verify:dafny
      # Quint downloads its evaluator from a GitHub release with no checksum. Instead the pinned release asset (quint-co/quint,
      # evaluator/v0.7.1, the version in @informalsystems/quint 0.33.1) is fetched over HTTPS, checked against its sha256 and
      # placed where Quint looks (QUINT_HOME), so Quint never downloads anything.
      - name: Install Quint evaluator 0.7.1
        run: |
          home="$RUNNER_TEMP/quint-home"
          mkdir -p "$home/rust-evaluator-v0.7.1"
          curl -fsSL -o "$RUNNER_TEMP/quint-evaluator.tar.gz" https://github.com/quint-co/quint/releases/download/evaluator/v0.7.1/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz
          echo "ce0502bdef65dc26c242a9e56379a9bb26de6f3db38f0e3989339d46a542f5eb  $RUNNER_TEMP/quint-evaluator.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/quint-evaluator.tar.gz" -C "$home/rust-evaluator-v0.7.1"
          chmod +x "$home/rust-evaluator-v0.7.1/quint_evaluator"
          echo "QUINT_HOME=$home" >> "$GITHUB_ENV"
      - name: Quint models keep their properties and their mutants fail
        run: pnpm run verify:quint:all
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
        env:
          PUBLICIST_PRIVATE_TOKEN: ${{ secrets.PUBLICIST_PRIVATE_TOKEN }}
      - run: pnpm exec vitest run tests/architecture/client-bundle.test.ts
        env:
          REQUIRE_CLIENT_BUNDLE: "1"
