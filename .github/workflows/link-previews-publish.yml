name: Publish link previews

# Trusted half of the link-preview flow. workflow_run always runs this file and the scripts it
# checks out from the default branch, never the pull request's code. The artifact is untrusted
# input: scripts/og-video/publish.mjs accepts only preview media, the manifest and the generated
# site tokens, checked by type and size. It commits them to the pull request, posts the contact
# sheets, then validates that commit (a push made with this token starts no workflow by itself).
# Merging approves the renders (owner decision, October 22, 2026).
on:
  workflow_run:
    workflows: [Link previews]
    types: [completed]

permissions:
  actions: write
  statuses: write
  contents: write
  pull-requests: write

concurrency:
  group: link-previews-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Find the pull request and the renders
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Unexpected branch or commit."; exit 1; }
          artifact=false
          if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" --jq '.artifacts[].name' | grep -qx link-previews; then artifact=true; fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN")
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/link-previews.yml" --jq '.id')
          default=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          [[ "$BRANCH" != "$default" && "$default" == main ]] || { echo "Ineligible destination."; exit 1; }
          jq -e --argjson workflow "$workflow" --arg sha "$SHA" '.event == "pull_request" and .workflow_id == $workflow and .head_sha == $sha and (.pull_requests | length) == 1' <<< "$run" >/dev/null
          number=$(jq -r '.pull_requests[0].number' <<< "$run")
          [[ "$number" =~ ^[0-9]+$ ]] || exit 1
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")
          jq -e --arg sha "$SHA" --arg branch "$BRANCH" --arg repo "$GITHUB_REPOSITORY" '.state == "open" and .base.ref == "main" and .base.repo.full_name == $repo and .head.repo.full_name == $repo and .head.ref == $branch and .head.sha == $sha' <<< "$pr" >/dev/null || { echo "Pull request moved or has an ineligible base."; exit 1; }
          encoded=$(jq -rn --arg branch "$BRANCH" '$branch | @uri')
          protected=$(gh api "repos/$GITHUB_REPOSITORY/branches/$encoded" --jq '.protected')
          [[ "$protected" == false ]] || { echo "Protected destination rejected."; exit 1; }
          { echo "number=$number"; echo "branch=$BRANCH"; echo "base=$(jq -r .base.sha <<< "$pr")"; } >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context=validate -f description="Waiting for trusted preview review"
          jq -e '.conclusion == "success"' <<< "$run" >/dev/null
      - if: steps.pr.outputs.number
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.pr.outputs.number
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr
      - name: Independently require review for changed preview inputs
        if: steps.pr.outputs.number
        id: required
        env:
          HAS_ARTIFACT: ${{ steps.pr.outputs.artifact }}
        run: node scripts/og-video/review-required.mjs pr
      - if: steps.pr.outputs.number && steps.pr.outputs.artifact == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: link-previews
          path: incoming
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check and apply the renders
        if: steps.pr.outputs.number && steps.pr.outputs.artifact == 'true'
        id: apply
        env:
          REQUIRED_SCENES: ${{ steps.required.outputs.scenes }}
          INCOMING: incoming
          TARGET: pr
          SHEETS_OUT: sheets
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg; fi
          node scripts/og-video/publish.mjs
      - name: Commit to the pull request
        if: steps.apply.outputs.scenes
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          SCENES: ${{ steps.apply.outputs.scenes }}
        working-directory: pr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/og src/data/og-media.json scripts/og-video/site-tokens.css docs/asset-reviews/link-previews.md
          if ! git diff --cached --quiet; then
            git commit -q -m "Render link previews: $SCENES" -m "Rendered by the Link previews workflow; review the contact sheets in the pull request description."
          fi
          # A push that lost a race with a newer commit fails here; that commit gets its own run.
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" -f state=pending -f context=validate -f description="Waiting for trusted secretless validation"
      - name: Publish the contact sheets
        if: steps.commit.outputs.sha
        id: sheets
        env:
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.commit.outputs.sha }}
        # The same scratch-index push as screenshots-publish.yml: fetch only the branch tip's trees
        # and send only this run's images. Runs in the pull request checkout for its credentials.
        working-directory: pr
        run: |
          dir="pr-${PR}/previews-${SHA::7}"
          export GIT_NO_LAZY_FETCH=1 GIT_INDEX_FILE="$RUNNER_TEMP/previews-index"
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          for i in $(seq 1 12); do
            rm -f "$GIT_INDEX_FILE"
            git fetch --depth=1 --filter=blob:none origin screenshots || { sleep $(( (RANDOM % 5) + i )); continue; }
            tip=$(git rev-parse FETCH_HEAD)
            git read-tree "$tip"
            git rm -r -q --cached --ignore-unmatch -- "$dir"
            find ../sheets -maxdepth 1 -name '*-sheet.png' -print0 | while IFS= read -r -d '' file; do
              printf '100644 %s\t%s\n' "$(git hash-object -w -- "$file")" "$dir/$(basename "$file")"
            done | git update-index --index-info
            tree=$(git write-tree --missing-ok)
            [ "$tree" = "$(git rev-parse "$tip^{tree}")" ] && { pushed=1; break; }
            commit=$(git commit-tree "$tree" -p "$tip" -m "chore: link-preview sheets for #${PR} at ${SHA::7}")
            if git push --no-thin origin "$commit:refs/heads/screenshots"; then pushed=1; break; fi
            sleep $(( (RANDOM % 5) + i ))
          done
          [ -n "${pushed:-}" ] || { echo "Could not push the contact sheets"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Update the PR description
        if: steps.sheets.outputs.dir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.commit.outputs.sha }}
          DIR: ${{ steps.sheets.outputs.dir }}
          SCENES: ${{ steps.apply.outputs.scenes }}
        run: node scripts/og-video/pr-section.mjs
      - name: Record trusted review receipt
        if: steps.sheets.outputs.dir
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          PR: ${{ steps.pr.outputs.number }}
          DIR: ${{ steps.sheets.outputs.dir }}
          SCENES: ${{ steps.apply.outputs.scenes }}
          BASE: ${{ steps.pr.outputs.base }}
          RENDER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          mkdir receipt
          jq -n --arg base "$BASE" --arg sha "$SHA" --arg pr "$PR" --arg dir "$DIR" --arg scenes "$SCENES" --arg renderRun "$RENDER_RUN" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '{base:$base,sha:$sha,pr:$pr,dir:$dir,scenes:$scenes,renderRun:$renderRun,run:$run,attempt:$attempt}' > receipt/receipt.json
      - if: steps.sheets.outputs.dir
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-receipt-${{ github.run_attempt }}
          path: receipt/receipt.json
          retention-days: 7
      - name: Validate after review sheets are attached
        if: steps.sheets.outputs.dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ steps.commit.outputs.sha }}
        run: gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref main -f "revision=$REVISION"
