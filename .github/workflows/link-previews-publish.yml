name: Publish link previews

# Trusted half of the link-preview flow. workflow_run always runs this file and the scripts it
# checks out from the default branch, never the pull request's code. The artifact is untrusted
# input: scripts/og-video/publish.mjs accepts only preview media, the manifest and the generated
# site tokens, checked by type and size. It commits them to the pull request, runs Validate on that
# commit (a push made with this token starts no workflow by itself) and posts the contact sheets.
# Merging approves the renders (owner decision, October 22, 2026).
on:
  workflow_run:
    workflows: [Link previews]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: link-previews-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Find the pull request and the renders
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Unexpected branch or commit."; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" --jq '.artifacts[].name' | grep -qx link-previews || { echo "No scene was stale; nothing to publish."; exit 0; }
          number=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$BRANCH" --jq '.[0].number // empty')
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "No open pull request for $BRANCH."; exit 0; }
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.head.sha')
          [[ "$head" == "$SHA" ]] || { echo "#$number has moved on to $head; a newer run renders it."; exit 0; }
          { echo "number=$number"; echo "branch=$BRANCH"; } >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.number
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.pr.outputs.number
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.branch }}
          path: pr
      - if: steps.pr.outputs.number
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: link-previews
          path: incoming
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check and apply the renders
        if: steps.pr.outputs.number
        id: apply
        env:
          INCOMING: incoming
          TARGET: pr
          SHEETS_OUT: sheets
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/og-video/publish.mjs
      - name: Commit to the pull request
        if: steps.pr.outputs.number
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          SCENES: ${{ steps.apply.outputs.scenes }}
        working-directory: pr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/og src/data/og-media.json scripts/og-video/site-tokens.css docs/asset-reviews/link-previews.md
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -q -m "Render link previews: $SCENES" -m "Rendered by the Link previews workflow; review the contact sheets in the pull request description."
          # A push that lost a race with a newer commit fails here; that commit gets its own run.
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
      - name: Publish the contact sheets
        if: steps.commit.outputs.sha
        id: sheets
        env:
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.commit.outputs.sha }}
        # The same scratch-index push as screenshots-publish.yml: fetch only the branch tip's trees
        # and send only this run's images. Runs in the pull request checkout for its credentials.
        working-directory: pr
        run: |
          dir="pr-${PR}/previews-${SHA::7}"
          export GIT_NO_LAZY_FETCH=1 GIT_INDEX_FILE="$RUNNER_TEMP/previews-index"
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          for i in $(seq 1 12); do
            rm -f "$GIT_INDEX_FILE"
            git fetch --depth=1 --filter=blob:none origin screenshots || { sleep $(( (RANDOM % 5) + i )); continue; }
            tip=$(git rev-parse FETCH_HEAD)
            git read-tree "$tip"
            git rm -r -q --cached --ignore-unmatch -- "$dir"
            find ../sheets -maxdepth 1 -name '*-sheet.png' -print0 | while IFS= read -r -d '' file; do
              printf '100644 %s\t%s\n' "$(git hash-object -w -- "$file")" "$dir/$(basename "$file")"
            done | git update-index --index-info
            tree=$(git write-tree --missing-ok)
            [ "$tree" = "$(git rev-parse "$tip^{tree}")" ] && { pushed=1; break; }
            commit=$(git commit-tree "$tree" -p "$tip" -m "chore: link-preview sheets for #${PR} at ${SHA::7}")
            if git push --no-thin origin "$commit:refs/heads/screenshots"; then pushed=1; break; fi
            sleep $(( (RANDOM % 5) + i ))
          done
          [ -n "${pushed:-}" ] || { echo "Could not push the contact sheets"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Update the PR description
        if: steps.sheets.outputs.dir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.commit.outputs.sha }}
          DIR: ${{ steps.sheets.outputs.dir }}
          SCENES: ${{ steps.apply.outputs.scenes }}
        run: node scripts/og-video/pr-section.mjs
