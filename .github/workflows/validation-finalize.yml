name: Trusted validation finalizer
on:
  workflow_run:
    workflows: [Validate, Publish link previews]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
concurrency:
  group: trusted-validation-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Never install dependencies, restore caches or execute candidate code in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve authenticated check and review provenance
        id: resolve
        run: node scripts/og-video/finalize-validation.mjs resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.resolve.outputs.sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Check immutable candidate data
        id: verify
        if: steps.resolve.outputs.sha
        run: node scripts/og-video/finalize-validation.mjs verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check private approvals with trusted code only
        id: gate
        if: steps.verify.outputs.ready == 'true'
        run: node scripts/publicist/gate.mjs
        env:
          PUBLICIST_PRIVATE_TOKEN: ${{ secrets.PUBLICIST_PRIVATE_TOKEN }}
      - name: Complete exact-head validation
        if: always() && steps.verify.outputs.ready == 'true'
        run: node scripts/og-video/finalize-validation.mjs finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_RESULT: ${{ steps.gate.outcome }}
