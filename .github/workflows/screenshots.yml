name: Screenshots

# Runs the pull request's own code, so it gets a read-only token. It only captures images and
# uploads them as an artifact; screenshots-publish.yml (always main's copy) publishes them.
# Only UI changes: pages, components, layouts, styles, browser scripts, page content and
# static assets. Server-only code (API routes, src/lib, middleware), migrations and
# dependency or Worker config changes don't trigger it.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/pages/**'
      - '!src/pages/api/**'
      - 'src/components/**'
      - 'src/layouts/**'
      - 'src/styles/**'
      - 'src/scripts/**'
      - 'src/assets/**'
      - 'src/content/**'
      - 'src/data/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'tailwind.config.mjs'
      - 'scripts/screenshots/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots:preview
      - name: Start the local preview
        run: |
          MUSIC_PREVIEW_CONFIG=.screenshots/wrangler.json npx astro dev --port 4321 --host 127.0.0.1 > astro.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:4321/ && break; sleep 2; done
      - run: npm run screenshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: |
            screenshots/*.png
            screenshots/manifest.json
          retention-days: 7
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-failures
          path: screenshots/_failure-*
          retention-days: 7
          if-no-files-found: ignore
      - if: failure()
        run: tail -80 astro.log || true
