name: Screenshots

# Runs the pull request's own code, so it gets a read-only token. It only captures images and
# uploads them as an artifact; screenshots-publish.yml (always main's copy) publishes them.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'scripts/screenshots/**'
      - 'astro.config.mjs'
      - 'tailwind.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots:preview
      - name: Start the local preview
        run: |
          MUSIC_PREVIEW_CONFIG=.screenshots/wrangler.json npx astro dev --port 4321 --host 127.0.0.1 > astro.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:4321/ && break; sleep 2; done
      - run: npm run screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: |
            screenshots/*.png
            screenshots/manifest.json
          retention-days: 7
          if-no-files-found: error
      - if: failure()
        run: tail -80 astro.log || true
