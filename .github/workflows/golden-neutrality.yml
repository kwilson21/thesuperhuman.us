name: Golden neutrality

# tests/golden/README.md, "A conversion is neutral when". A pull request that carries the `conversion` label must prove that
# it changed nothing visible: this job fails unless `golden:neutral --all` says NEUTRAL. Without the label it only reports
# (a behaviour fix changes fixtures on purpose). A usage or read error fails the job either way.
#
# It is its own workflow, not a step of validate.yml, so that adding or removing a label re-runs only this job (a minute)
# and never cancels or repeats the full validation, and `push` is untouched.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: golden-neutrality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  neutrality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # An expression that yields exactly true or false. The label text itself is never put on a shell line.
      CONVERSION: ${{ contains(github.event.pull_request.labels.*.name, 'conversion') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: on a pull request the checkout is the merge of the head into the base, so its first parent is the
          # base branch tip and HEAD^1..HEAD is exactly what the pull request changes.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Golden neutrality report
        run: |
          set +e
          node scripts/golden-neutral.mjs --all HEAD^1 HEAD > "$RUNNER_TEMP/neutral.txt" 2>&1
          status=$?
          {
            echo "### Golden neutrality: base \`$(git rev-parse --short HEAD^1)\` against the merge result \`$(git rev-parse --short HEAD)\`"
            echo
            echo "Exit code $status (0 neutral, 1 not neutral or not comparable, 2 error). Label \`conversion\`: $CONVERSION."
            echo
            echo '```'
            head -c 900000 "$RUNNER_TEMP/neutral.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/neutral.txt"
          if [ "$status" -ge 2 ]; then exit "$status"; fi
          if [ "$CONVERSION" = "true" ] && [ "$status" -ne 0 ]; then
            echo "::error::This pull request has the conversion label, so every golden case must be neutral."
            exit 1
          fi
