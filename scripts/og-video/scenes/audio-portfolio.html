<!doctype html>
<!-- Audio portfolio (/audio/portfolio): the Old News A/B comparison. The comparison player
     (src/components/audio/ComparisonPlayer.astro) is drawn at video scale with the song's measured
     waveforms (src/content/audio-examples/old-news-mastering.json): the mix in lane A, the master
     in lane B, both at full strength in the compact geometry (src/lib/waveform.ts), with no dimming,
     so any difference between the lanes comes from the data alone. The clip plays B, switches
     to A at the same point, switches back, then seeks back to the start position. Copy is verbatim:
     the heading from src/pages/audio/portfolio.astro, the release from
     src/content/releases/old-news-single.json, and the lanes, switch, "Selected" and instruction
     from ComparisonPlayer.astro. -->
<html lang="en" data-duration="6000">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../kit.css" />
<style>
  h1 { position: absolute; left: 64px; top: 98px; }
  .lede { position: absolute; left: 64px; top: 293px; margin: 0; font: 400 24px/30px var(--sans); color: var(--muted); white-space: nowrap; }

  /* The release, as the case title and cover sit on the page (music-hubs.css .portfolio-cover, .case-title). */
  .cover { position: absolute; right: 64px; top: 60px; width: 200px; height: 200px; box-shadow: 0 6px 15px #3826151a; }
  .case { position: absolute; right: 292px; top: 168px; text-align: right; }
  .case h2 { font: 400 48px/1.1 var(--serif); letter-spacing: -.02em; white-space: nowrap; }
  .case p { margin-top: 6px; font: 400 24px/30px var(--serif); color: var(--muted); white-space: nowrap; }
  .case .name { font-family: var(--name-text); }

  /* .comparison-switch: rule border; the pressed version fills with ink (A) or the accent (B). */
  .switch { position: absolute; right: 64px; top: 280px; display: flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
  .switch b { position: relative; display: block; padding: 10px 20px; font: 400 26px/32px var(--sans); white-space: nowrap; }
  .switch b i { position: absolute; inset: 0; opacity: 0; }
  .switch b span { position: relative; }
  .switch .sa i { background: var(--ink); }
  .switch .sb i { background: var(--accent); opacity: 1; }
  .switch .sb span { color: var(--paper); }

  /* .comparison-player: rule border, radius 4. Each lane: its heading, then the waveform. */
  .player { position: absolute; left: 64px; right: 64px; top: 344px; height: 198px; border: 1px solid var(--rule); border-radius: 4px; padding: 0 20px; }
  .lane { position: relative; height: 98px; display: grid; grid-template-columns: 150px 1fr; column-gap: 16px; align-items: center; color: var(--muted); }
  .lane + .lane { border-top: 1px solid var(--rule); }
  .lane.lb { color: var(--accent); }
  .head { position: relative; height: 70px; }
  .letter { position: absolute; left: 0; top: 0; width: 38px; height: 38px; border: 1.5px solid currentColor; border-radius: 50%; display: grid; place-items: center; font: 400 22px/1 var(--sans); }
  .lname { position: absolute; left: 52px; top: 4px; font: 400 24px/30px var(--sans); white-space: nowrap; }
  .selected { position: absolute; left: 52px; top: 42px; font: 400 20px/24px var(--sans); white-space: nowrap; opacity: 0; }
  .lb .selected { opacity: 1; }
  .stage { position: relative; height: 84px; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage line { stroke: currentColor; stroke-width: 2; }
  .base { color: var(--wave-unplayed); }
  .played { color: var(--accent); clip-path: inset(0 62% 0 0); }
  .track { position: absolute; inset: 0; transform: translateX(38%); will-change: transform; }
  .track i { position: absolute; left: -1px; top: -6px; bottom: -6px; width: 2px; background: var(--accent); }
</style>
</head>
<body>
<main class="frame card">
  <p class="kicker">Audio / Portfolio</p>
  <h1 class="h-84">Hear the<br />difference.</h1>
  <p class="lede">Switch versions. Keep your place.</p>
  <img class="cover" src="../../../public/music/old-news-single-0db5fc05dca4ee79.webp" alt="" width="1254" height="1254" />
  <div class="case"><h2>Old News</h2><p><span class="name">Kazon</span> · Prod. Lexi Banks</p></div>
  <div class="switch"><b class="sa"><i></i><span>A Mix</span></b><b class="sb"><i></i><span>B Master</span></b></div>
  <div class="player">
    <div class="lane la"><div class="head"><span class="letter">A</span><span class="lname">Mix</span><span class="selected">Selected</span></div>
      <div class="stage"><svg class="base" viewBox="0 0 1280 64" preserveAspectRatio="none"></svg><svg class="played" viewBox="0 0 1280 64" preserveAspectRatio="none"></svg><div class="track"><i></i></div></div></div>
    <div class="lane lb"><div class="head"><span class="letter">B</span><span class="lname">Master</span><span class="selected">Selected</span></div>
      <div class="stage"><svg class="base" viewBox="0 0 1280 64" preserveAspectRatio="none"></svg><svg class="played" viewBox="0 0 1280 64" preserveAspectRatio="none"></svg><div class="track"><i></i></div></div></div>
  </div>
  <p class="url">thesuperhuman.us/audio/portfolio</p>
</main>

  // Playback runs at one rate from 700 to 4900 ms (38% to 80%) through both switches, so the

  const P0 = 38, P1 = 80, PLAY = 700, STOP = 4900, SEEK = 5450, A_ON = 2300, B_ON = 3900, SW = 150;
  // The accent copy is clipped to the position and the playhead rides on it, in both lanes, as on the page.
  const run = at => [[PLAY, { ...at(P0), easing: 'linear' }], [STOP, { ...at(P1), easing: ease.inOut }], [SEEK, at(P0)]];
  play('.played', run(p => ({ clipPath: `inset(0 ${100 - p}% 0 0)` })));

  // The switch changes state at once, as aria-pressed does on the page (a crossfade would pass

  const toggle = (a, b, ms) => [[A_ON, a], [A_ON + ms, b], [B_ON, b], [B_ON + ms, a]];
  const ink = { color: '#0E0E0E' }, paper = { color: '#FBF8F2' }, shown = { opacity: 1 }, hidden = { opacity: 0 };

  play('.sb span', toggle(paper, ink, 1));
  play('.la .selected', toggle(hidden, shown, SW));
  play('.lb .selected', toggle(shown, hidden, SW));
