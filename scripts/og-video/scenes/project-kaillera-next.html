<!doctype html>
<!-- Kaillera Next (/building/kaillera-next): the project page's title, promise and status in Home's
     dark screen world, beside the real landing page (no open rooms, no game footage, no ROMs).
     Under it, a rollback tape drawn in the site's palette and labelled as a diagram: the playhead
     stays put and the frames run past it. A frame is played on a guessed input, play goes on, the
     late input proves the guess wrong, the tape rewinds to that frame and replays the frames after
     it in a quick burst, then play goes on until the next wrong guess. The tape moves by whole
     frames, so the loop wraps eleven frames later on an identical picture, with no fade.
     Copy is verbatim: title, subtitle and status from src/data/project-stories/kaillera-next.ts:26-29;
     kicker from src/layouts/ProjectLayout.astro:28 (first crumb only, the headline carries the
     name); the two captions are the clauses of the Rollback entry's summary
     (src/data/project-stories/kaillera-next.ts:110), each capitalised; "Rollback" is that entry's
     title (:109) and "Diagram" is the page's own label for its rollback drawing (:112). The
     capture is the Home card's landing page (index.astro:96), cropped above its lower section. -->
<html lang="en" data-duration="6000">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../kit.css" />
<style>
  /* Home's screen light (index.astro:167), pulled toward the capture. */
  .light { position: absolute; inset: 0 0 auto; height: 440px; z-index: -1; pointer-events: none;
    background: radial-gradient(55% 60% at 72% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%); }
  h1 { position: absolute; left: 61px; top: 112px; margin: 0; white-space: nowrap; }
  .lede { position: absolute; left: 64px; top: 228px; width: 470px; margin: 0; }
  .status { position: absolute; left: 64px; top: 380px; margin: 0; white-space: nowrap; }

  /* The landing page, cropped above its ROM line and "You bring the game" section (source rows 0-556). */
  .shot { position: absolute; left: 596px; top: 60px; width: 540px; height: 240px; }

  /* Rollback tape. Strip box: 540 × 112 at (596, 380). Frames are 20 × 56 on a 40 px period. */
  .tag { position: absolute; left: 596px; top: 356px; margin: 0; font: 500 20px/24px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .strip { position: absolute; left: 596px; top: 380px; width: 540px; height: 112px; }
  .track { position: absolute; left: 0; right: 0; top: 104px; height: 2px; background: var(--rule); }
  /* The window shows slots 0-13 and fades a frame in or out as it slides past either end. */
  .window { position: absolute; left: -20px; top: 0; width: 580px; height: 102px; overflow: hidden;
    mask-image: linear-gradient(to right, transparent, #000 20px, #000 560px, transparent); }
  .tape { position: absolute; left: 20px; top: 0; width: 1200px; height: 102px; will-change: transform; }
  .tape i { position: absolute; top: 40px; width: 20px; height: 56px; border-radius: 3px; background: #3a342d; }
  .playhead { position: absolute; left: 248px; top: 32px; width: 4px; height: 78px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 12px rgba(242, 237, 228, .35); }
  /* Each rewind arc rides on the tape: it joins the frame the playhead left to the wrong guess. */
  .arc { position: absolute; top: 0; width: 200px; height: 40px; overflow: visible; }
  .arc path { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .arc .bow { stroke-dasharray: 1; }
  .arc .head { fill: var(--accent); stroke-width: 1.5; }
  /* The page's sentence (kaillera-next.ts:110) on two lines; the half the tape is showing is lit. */
  .say { position: absolute; left: 596px; top: 496px; width: 540px; height: 56px; margin: 0; }
  .say span { position: absolute; left: 0; font: 400 24px/28px var(--sans); color: var(--ink); white-space: nowrap; opacity: .45; }
  .say .s-guess { top: 0; }
  .say .s-wrong { top: 28px; opacity: 1; }
</style>
</head>
<body>
<main class="frame card world-screen">
  <div class="light"></div>
  <p class="kicker">Building</p>
  <h1 class="h-84">Kaillera Next</h1>
  <p class="lede">Open a link and play supported N64 games with friends, nothing to install.</p>
  <p class="status">In development · playable demo build</p>

  <div class="capture shot"><img src="../../../src/assets/projects/kaillera-next/landing-2026-09-26.webp" alt="" width="1252" height="835" /></div>

  <p class="tag">Rollback · Diagram</p>
  <div class="strip">
    <div class="track"></div>
    <div class="window"><div class="tape">
      <!-- From frame W+4 back to the wrong guess W: frames 10 to 6 for the poster, 21 to 17 for the next. -->
      <svg class="arc arc-a" style="left: 230px" viewBox="0 0 200 40" aria-hidden="true"><path class="bow" pathLength="1" d="M180 36 C 180 -4, 20 -4, 20 19" /><path class="head" d="M13.5 17 L26.5 17 L20 28 Z" /></svg>
      <svg class="arc arc-b" style="left: 670px" viewBox="0 0 200 40" aria-hidden="true"><path class="bow" pathLength="1" d="M180 36 C 180 -4, 20 -4, 20 19" /><path class="head" d="M13.5 17 L26.5 17 L20 28 Z" /></svg>
    </div></div>
    <div class="playhead"></div>
  </div>
  <p class="say"><span class="s-guess">Guess a late input, keep playing,</span><span class="s-wrong">and rewind if the guess was wrong.</span></p>

  <p class="url">thesuperhuman.us/building/kaillera-next</p>
</main>
<script src="../kit.js"></script>
<script>
  const { play, ease } = og;
  const P = 6, PERIOD = 40, COUNT = 30;
  const C = { played: '#b0a799', wrong: '#e08a62', waiting: '#5c564e', ahead: '#3a342d', replayed: '#f2ede4', ground: '#14120f' };
  const tape = document.querySelector('.tape');
  const frames = Array.from({ length: COUNT }, (_, f) => { const el = document.createElement('i'); el.style.left = `${f * PERIOD}px`; tape.append(el); return el; });
  const X = s => ({ transform: `translateX(${-s * PERIOD}px)` });

  // Tape position s puts frame s + P under the playhead. Poster: s = 0, so frame 6 is the wrong guess.
  // Replay burst (the tight loop): four 100 ms ticks, landing at 800-1100.
  const replay = [800, 900, 1000, 1100];
  // Play: eleven 220 ms ticks, landing at 1320-3520 (s = 5..15).
  const playTicks = Array.from({ length: 11 }, (_, k) => 1320 + 220 * k);
  const GUESS = 17;              // lands under the playhead at s = 11, 2640 ms
  const LATE = 3600;             // the late input arrives and disagrees
  const REWIND = [3900, 4500];   // s 15 -> 11; frame 17 is back under the playhead
  const steps = [[0, X(0)]];
  replay.forEach((t, k) => steps.push([t - 60, { ...X(k), easing: ease.out }], [t, X(k + 1)]));
  playTicks.forEach((t, k) => steps.push([t - 90, { ...X(k + 4), easing: ease.out }], [t, X(k + 5)]));
  steps.push([REWIND[0], { ...X(15), easing: ease.inOut }], [REWIND[1], X(11)]);
  play(tape, steps);

  // When frame f lands under the playhead.
  const lands = f => (f >= 7 && f <= 10 ? replay[f - 7] : playTicks[f - 11]);
  const swap = (el, from, to, t, fade = 60) => play(el, [[t, { backgroundColor: from }], [t + fade, { backgroundColor: to }]]);
  frames.forEach((el, f) => {
    if (f <= 5) el.style.background = C.played;
    else if (f === 6) el.style.background = C.wrong;
    else if (f <= 10) swap(el, C.waiting, C.replayed, lands(f));
    else if (f <= 16) swap(el, C.ahead, C.played, lands(f));
    else if (f === GUESS) {
      // Played on a guess: hollow, outlined in the accent. The late input fills it: the guess was wrong.
      play(el, [
        [lands(f), { backgroundColor: C.ahead, boxShadow: `inset 0 0 0 2px ${C.ahead}` }],
        [lands(f) + 60, { backgroundColor: C.ground, boxShadow: `inset 0 0 0 2px ${C.wrong}` }],
        [LATE, { backgroundColor: C.ground, boxShadow: `inset 0 0 0 2px ${C.wrong}` }],
        [LATE + 120, { backgroundColor: C.wrong, boxShadow: `inset 0 0 0 2px ${C.wrong}` }],
      ]);
      play(el, [[LATE, { transform: 'scaleY(1)', easing: ease.spring }], [LATE + 220, { transform: 'scaleY(1.18)', easing: ease.out }], [LATE + 450, { transform: 'scaleY(1)' }]]);
    } else if (f <= 21) {
      // Played after the guess, then waiting to be replayed once the tape rewinds past them.
      const back = 3960 + (21 - f) * 110;
      play(el, [[lands(f), { backgroundColor: C.ahead }], [lands(f) + 60, { backgroundColor: C.played }], [back, { backgroundColor: C.played }], [back + 140, { backgroundColor: C.waiting }]]);
    }
  });

  // The poster's arc leaves as the replay starts; the next one draws during the rewind, starting
  // at the frame under the playhead and ending on the wrong guess as it arrives there.
  play('.arc-a', [[700, { opacity: 1 }], [950, { opacity: 0 }]]);
  play('.arc-b .bow', [[3950, { strokeDashoffset: 1, easing: ease.inOut }], [4450, { strokeDashoffset: 0 }]]);
  play('.arc-b', [[3949, { opacity: 0 }], [3950, { opacity: 1 }]]);
  play('.arc-b .head', [[4400, { opacity: 0 }], [4500, { opacity: 1 }]]);

  // Captions narrate the tape: the guess and the play that follows it, then the rewind.
  // The two halves cross-fade: "keep playing" lights while the tape plays, "rewind" when it rewinds.
  play('.s-wrong', [[0, { opacity: 1 }], [1250, { opacity: 1, easing: ease.in }], [1400, { opacity: .45 }], [LATE, { opacity: .45, easing: ease.out }], [LATE + 160, { opacity: 1 }]]);
  play('.s-guess', [[1250, { opacity: .45, easing: ease.out }], [1400, { opacity: 1 }], [LATE, { opacity: 1, easing: ease.in }], [LATE + 160, { opacity: .45 }]]);
</script>
</body>
</html>
