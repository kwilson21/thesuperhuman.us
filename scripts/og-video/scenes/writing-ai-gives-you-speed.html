<!doctype html>
<!-- AI essay (/writing/ai-gives-you-speed): the essay's own figure is the argument. The poster is the
     title over the finished comparison. Both paths clear, then they redraw from the start at the same
     moment: the path without checkpoints runs in one sweep and finishes first, pointing away from
     its intended outcome; the path with checkpoints draws one step at a time, stops at each
     checkpoint (a pulse marks the check), and reaches the outcome last. Copy is verbatim:
     the kicker from src/pages/writing/ai-gives-you-speed.astro:23, the title from
     src/content/pages/ai-gives-you-speed.md:2, the figure's headings, ends and caption from :52, :58,
     :61, :68 and :70. Paths, arrowheads and circles are the essay's own SVG (:53-66), viewBox cropped
     to 0 10 600 85 and strokes thickened for the small preview. The title is static and never split.
     The page's description is left to og:description so the poster stays within its word budget. -->
<html lang="en" data-duration="6000">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../kit.css" />
<style>
  .title { position: absolute; left: 64px; top: 100px; margin: 0; white-space: nowrap; }
  /* .direction-comparison (ai-gives-you-speed.astro:69-75): #f3eee5 ground, rule between the paths. */
  .fig { position: absolute; left: 64px; top: 272px; width: 1072px; height: 270px; margin: 0; }
  .ends { position: absolute; left: 314px; top: 12px; width: 734px; display: flex; justify-content: space-between; color: var(--muted); }
  .ends span { white-space: nowrap; }
  .row { position: absolute; left: 0; width: 1072px; height: 115px; }
  .r1 { top: 40px; }
  .r2 { top: 155px; border-top: 1px solid var(--rule); }
  .row h3 { position: absolute; left: 24px; top: 36px; margin: 0; font: 400 28px/34px var(--serif); letter-spacing: -.01em; color: var(--accent); white-space: nowrap; }
  .row svg { position: absolute; right: 24px; top: 5px; width: 734px; height: 104px; overflow: visible; }
  .muted { stroke: var(--muted); }
  .acc { stroke: var(--accent); }
  .ink { fill: var(--ink); }
  .solid { stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 2; }
  .dashed { stroke-width: 3; stroke-dasharray: 7 8; }
  .head { stroke-linecap: round; stroke-linejoin: round; }
  .reveal { stroke: #fff; stroke-width: 12; stroke-dasharray: 1 2; }
  .cp circle, .pulse circle { transform-box: fill-box; transform-origin: center; }
  .pulse circle { fill: none; stroke: var(--accent); stroke-width: 3; vector-effect: non-scaling-stroke; opacity: 0; }
</style>
</head>
<body>
<main class="frame">
  <p class="kicker">Writing / AI-assisted engineering</p>
  <h1 class="title h-68">AI Gives You Speed.<br />Engineering Gives It Direction.</h1>
  <figure class="fig panel">
    <div class="ends label"><span>Start</span><span>Intended outcome</span></div>
    <div class="row r1">
      <h3>Without checkpoints</h3>
      <svg viewBox="0 10 600 85" fill="none" aria-hidden="true">
        <defs>
          <mask id="drift-mask" maskUnits="userSpaceOnUse" x="-20" y="-20" width="640" height="140">
            <path class="reveal" pathLength="1" d="M10 80C100 85 130 15 190 45S240 110 300 70 350 90 420 20" />
          </mask>
        </defs>
        <path class="drift dashed muted" mask="url(#drift-mask)" d="M10 80C100 85 130 15 190 45S240 110 300 70 350 90 420 20" />
        <path class="drift-head head muted" stroke-width="3" d="m408 23 13-5-3 14" />
        <circle class="ink" cx="10" cy="80" r="6" />
        <circle cx="590" cy="40" r="7.5" stroke="var(--ink)" stroke-width="2.5" />
      </svg>
    </div>
    <div class="row r2">
      <h3>With checkpoints</h3>
      <svg viewBox="0 10 600 85" fill="none" aria-hidden="true">
        <path class="steady solid acc" pathLength="1" d="M10 80C70 80 90 60 130 55S195 35 240 65 330 75 380 50 460 65 560 40" />
        <path class="steady-head head acc" stroke-width="4" d="m547 34 15 5-11 10" />
        <circle class="ink" cx="10" cy="80" r="6" />
        <g class="pulse"><circle cx="130" cy="55" r="6" /><circle cx="240" cy="65" r="6" /><circle cx="380" cy="50" r="6" /><circle cx="590" cy="40" r="7.5" /></g>
        <g class="cp" fill="var(--paper)" stroke="var(--accent)" stroke-width="3"><circle cx="130" cy="55" r="6" /><circle cx="240" cy="65" r="6" /><circle cx="380" cy="50" r="6" /></g>
        <circle class="target" cx="590" cy="40" r="7.5" fill="var(--paper)" stroke="var(--accent)" stroke-width="3" />
      </svg>
    </div>
  </figure>
  <p class="url">thesuperhuman.us/writing/ai-gives-you-speed</p>
  <p class="aside caption">Illustration of course correction.</p>
</main>
<script src="../kit.js"></script>
<script>
  const { play, ease } = og;
  const steady = document.querySelector('.steady');
  const cps = [...document.querySelectorAll('.cp circle')];
  // Where each checkpoint sits along the solid path, as a fraction of its length (about .217, .418, .679).
  const total = steady.getTotalLength();
  const at = circle => {
    const cx = +circle.getAttribute('cx'), cy = +circle.getAttribute('cy');
    let best = 0, gap = Infinity;
    for (let s = 0; s <= total; s += total / 4000) {
      const p = steady.getPointAtLength(s);
      const d = Math.hypot(p.x - cx, p.y - cy);
      if (d < gap) { gap = d; best = s; }
    }
    return best / total;
  };
  const stops = [...cps.map(at), 1];

  // 0-600 poster hold. 600-900 both paths, their arrowheads and the checkpoints fade; the start dots,
  // the outcome rings and every label stay. Each path is reset to undrawn at 900, while invisible.
  const FADE = [600, 900], START = 1000;
  const hide = { opacity: 0 }, show = { opacity: 1 };
  play('.drift, .steady', [[FADE[0], { ...show, easing: 'ease' }], [FADE[1], hide], [FADE[1] + 1, show]]);
  // The dashed path is revealed through a solid white copy in its mask, so its dashes never crawl.
  play('.reveal', [[FADE[1], { strokeDashoffset: 0 }], [FADE[1] + 1, { strokeDashoffset: 1 }], [START, { strokeDashoffset: 1, easing: ease.inOut }], [2800, { strokeDashoffset: 0 }]]);
  play('.drift-head', [[FADE[0], { ...show, easing: 'ease' }], [FADE[1], hide], [2800, { ...hide, easing: 'ease-out' }], [2950, show]]);

  // With checkpoints: the same pen speed, one step at a time, with a stop at each checkpoint.
  const MS_PER_PATH = 1990, PAUSE = 350, step = 'cubic-bezier(.35, 0, .35, 1)';
  const solid = [[FADE[1], { strokeDashoffset: 0 }], [FADE[1] + 1, { strokeDashoffset: 1 }]];
  let t = START, from = 0;
  const arrivals = stops.map(to => {
    solid.push([t, { strokeDashoffset: 1 - from, easing: step }]);
    t += Math.round((to - from) * MS_PER_PATH);
    solid.push([t, { strokeDashoffset: 1 - to }]);
    const arrived = t;
    t += PAUSE; from = to;
    return arrived;
  });
  play('.steady', solid);
  // Each checkpoint lands as the pen reaches it, and a ring goes out from it (the press-ring pulse).
  const pulses = [...document.querySelectorAll('.pulse circle')];
  cps.forEach((cp, i) => play(cp, [[FADE[0], { opacity: 1, transform: 'scale(1)', easing: 'ease' }], [FADE[1], { opacity: 0, transform: 'scale(1)' }], [FADE[1] + 1, { opacity: 0, transform: 'scale(.4)' }], [arrivals[i] - 40, { opacity: 0, transform: 'scale(.4)', easing: ease.spring }], [arrivals[i] + 180, { opacity: 1, transform: 'scale(1)' }]]));
  const ring = (el, t0, scale, ms) => play(el, [[t0, { opacity: 0, transform: 'scale(1)', easing: 'linear' }], [t0 + 40, { opacity: .9, transform: 'scale(1.05)', easing: ease.ring }], [t0 + ms, { opacity: 0, transform: `scale(${scale})` }]]);
  pulses.slice(0, 3).forEach((p, i) => ring(p, arrivals[i], 2.6, 700));
  const last = arrivals[3];
  play('.steady-head', [[FADE[0], { ...show, easing: 'ease' }], [FADE[1], hide], [last, { ...hide, easing: 'ease-out' }], [last + 150, show]]);
  ring(pulses[3], last, 2.8, 900);
</script>
</body>
</html>
